name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Use the same checks locally and in CI, including tests against dist/.
      - name: Verify content, types, build and tests
        run: npm run verify

      - name: Bundle report
        if: ${{ success() && hashFiles('dist/assets/*') != '' }}
        run: |
          echo "### Bundle sizes (gzip)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          shopt -s nullglob
          for f in dist/assets/*.js dist/assets/*.css; do
            printf '%-42s %8s\n' "$(basename "$f")" "$(gzip -c "$f" | wc -c | awk '{printf "%.1f KB", $1/1024}')" >> $GITHUB_STEP_SUMMARY
          done
          echo '```' >> $GITHUB_STEP_SUMMARY
